<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EVO Login</title>
</head>
<body style="background:#151515;color:white;font-family:Arial;">

<form method="post" action="{{ BASE_PATH }}/" style="max-width:300px;margin:100px auto;">
  <h2>EVO Manager Login</h2>

  <input

    Login
  </button>
</form>

</body>
</html>
